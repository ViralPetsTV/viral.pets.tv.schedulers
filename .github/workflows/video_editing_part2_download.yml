name: VIDEO EDITING PART 2 - DOWNLOAD & CATCH-UP

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 * * * *'    # Hourly (catch-up for delayed Kaggle runtimes)

concurrency:
  group: video-editing-kaggle-orchestration
  cancel-in-progress: false

jobs:
  download-and-catchup:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ViralPetsTV/viral.pets.tv
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          sparse-checkout: |
            REELS
            KAGGLE/
          fetch-depth: 1

      # Pull latest changes
      - name: Pull Latest Changes
        run: |
          git pull origin main

      # Ensure pending state file exists and has valid defaults
      - name: Ensure Pending State
        run: |
          python3 KAGGLE/kaggle_pending_manager.py ensure

      # Install Kaggle API
      - name: Install Kaggle API
        run: pip install kaggle

      # Poll every pending account and download anything complete
      - name: Process Pending Accounts
        id: process_pending
        env:
          KAGGLE_USERNAME_1: ${{ secrets.KAGGLE_USERNAME_1 }}
          KAGGLE_KEY_1: ${{ secrets.KAGGLE_KEY_1 }}
          KAGGLE_USERNAME_2: ${{ secrets.KAGGLE_USERNAME_2 }}
          KAGGLE_KEY_2: ${{ secrets.KAGGLE_KEY_2 }}
          KAGGLE_USERNAME_3: ${{ secrets.KAGGLE_USERNAME_3 }}
          KAGGLE_KEY_3: ${{ secrets.KAGGLE_KEY_3 }}
        run: |
          python3 KAGGLE/kaggle_pending_manager.py process_pending

      # Commit downloaded reels and pending-state updates
      - name: Commit and Push Updates
        if: steps.process_pending.outputs.state_changed == 'true' || steps.process_pending.outputs.completed_downloads != '0'
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "github-actions@github.com"
          git add --sparse REELS KAGGLE/kaggle_pending_runs.json || echo "Nothing to add"
          if git diff --cached --quiet; then
            echo "No changes detected after processing pending accounts"
          else
            git commit -m "Kaggle catch-up sync (${{ steps.process_pending.outputs.completed_downloads }} downloads)" || echo "No commit created"
            git pull --rebase origin main
            git push
          fi

      # Summary
      - name: Summary
        run: |
          if [[ "${{ steps.process_pending.outputs.completed_downloads }}" != "0" ]]; then
            echo "✅ Downloaded ${{ steps.process_pending.outputs.completed_downloads }} completed Kaggle output(s)."
          elif [[ "${{ steps.process_pending.outputs.state_changed }}" == "true" ]]; then
            echo "ℹ️ Updated pending state (running/failed transitions), no completed downloads this run."
          else
            echo "ℹ️ No pending completed kernels found this hour."
          fi
