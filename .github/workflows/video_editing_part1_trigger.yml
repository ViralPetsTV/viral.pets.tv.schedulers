name: VIDEO EDITING PART 1 - TRIGGER KAGGLE

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '30 18 * * *'   # 12:00 AM IST (6:30 PM UTC previous day)
  #   - cron: '30 6 * * *'    # 12:00 PM IST (6:30 AM UTC)

concurrency:
  group: video-editing-kaggle-orchestration
  cancel-in-progress: false

jobs:
  prepare-submission:
    runs-on: ubuntu-latest
    outputs:
      should_submit: ${{ steps.allocate.outputs.should_submit }}
      account_number: ${{ steps.allocate.outputs.account_number }}
      video_number: ${{ steps.allocate.outputs.video_number }}
    steps:
      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ViralPetsTV/viral.pets.tv
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          sparse-checkout: |
            counter_video_editing.txt
            video_end_tracker.txt
            KAGGLE/
          fetch-depth: 1

      - name: Pull Latest Changes
        run: |
          git pull origin main

      # Set up Python for counter scripts
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.9'

      - name: Ensure Pending State
        run: |
          python3 KAGGLE/kaggle_pending_manager.py ensure

      - name: Reserve Account and Candidate Video
        id: allocate
        run: |
          python3 KAGGLE/kaggle_pending_manager.py allocate

      - name: Commit Reservation
        if: steps.allocate.outputs.should_submit == 'true'
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "github-actions@github.com"
          git add KAGGLE/kaggle_pending_runs.json
          git commit -m "Reserve Kaggle account ${{ steps.allocate.outputs.account_number }} for Video_${{ steps.allocate.outputs.video_number }}" || echo "No changes to commit"
          git pull --rebase origin main
          git push

  run-on-kaggle:
    needs: prepare-submission
    if: needs.prepare-submission.outputs.should_submit == 'true'
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ViralPetsTV/viral.pets.tv
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          sparse-checkout: |
            IPNBY/quality.ipynb
            VIDEO_EDITING_QUALITY
            counter_video_editing.txt
            video_end_tracker.txt
            requirements.txt
            KAGGLE/
            REELS
          fetch-depth: 1

      # Pull latest changes (includes updated counter)
      - name: Pull Latest Changes
        run: |
          git pull origin main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.9'

      - name: Ensure Pending State
        run: |
          python3 KAGGLE/kaggle_pending_manager.py ensure

      # Set Kaggle credentials based on account number
      - name: Set Kaggle Credentials
        id: set_kaggle_creds
        run: |
          ACCOUNT_NUM=${{ needs.prepare-submission.outputs.account_number }}

          case $ACCOUNT_NUM in
            1)
              KAGGLE_USERNAME="${{ secrets.KAGGLE_USERNAME_1 }}"
              KAGGLE_KEY="${{ secrets.KAGGLE_KEY_1 }}"
              ;;
            2)
              KAGGLE_USERNAME="${{ secrets.KAGGLE_USERNAME_2 }}"
              KAGGLE_KEY="${{ secrets.KAGGLE_KEY_2 }}"
              ;;
            3)
              KAGGLE_USERNAME="${{ secrets.KAGGLE_USERNAME_3 }}"
              KAGGLE_KEY="${{ secrets.KAGGLE_KEY_3 }}"
              ;;
            *)
              echo "❌ Invalid account number: $ACCOUNT_NUM"
              exit 1
              ;;
          esac

          echo "kaggle_username=$KAGGLE_USERNAME" >> $GITHUB_OUTPUT
          echo "kaggle_key=$KAGGLE_KEY" >> $GITHUB_OUTPUT
          echo "Using Kaggle credentials for account $ACCOUNT_NUM"

      - name: Stage Counter for Submission
        run: |
          VIDEO_NUMBER="${{ needs.prepare-submission.outputs.video_number }}"
          echo "$VIDEO_NUMBER" > counter_video_editing.txt
          echo "Prepared counter file for Video_${VIDEO_NUMBER}"

      - name: Configure Sparse Checkout
        run: |
          VIDEO_NUMBER="${{ needs.prepare-submission.outputs.video_number }}"
          echo "Processing Video_${VIDEO_NUMBER}.mp4"
          echo "VIDEOS/Video_${VIDEO_NUMBER}.mp4" >> .git/info/sparse-checkout
          echo "REELS" >> .git/info/sparse-checkout
          git sparse-checkout reapply

      # Install Kaggle API
      - name: Install Kaggle API
        run: pip install kaggle

      # Configure Kaggle with credentials
      - name: Configure Kaggle
        run: |
          mkdir -p ~/.kaggle
          KAGGLE_USERNAME="${{ steps.set_kaggle_creds.outputs.kaggle_username }}"
          KAGGLE_KEY="${{ steps.set_kaggle_creds.outputs.kaggle_key }}"
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      # Prepare Dataset Folder
      - name: Prepare Dataset Folder
        run: |
          mkdir -p kaggle-dataset
          cp -r REELS kaggle-dataset/ || true
          cp -r VIDEO_EDITING_QUALITY kaggle-dataset/ || true
          cp counter_video_editing.txt kaggle-dataset/ || true
          cp video_end_tracker.txt kaggle-dataset/ || true
          cp requirements.txt kaggle-dataset/ || true
          cp IPNBY/quality.ipynb kaggle-dataset/

          VIDEO_NUMBER="${{ needs.prepare-submission.outputs.video_number }}"
          mkdir -p kaggle-dataset/VIDEOS
          cp "VIDEOS/Video_${VIDEO_NUMBER}.mp4" kaggle-dataset/VIDEOS/ || echo "Video file not found: VIDEOS/Video_${VIDEO_NUMBER}.mp4"

          # Kaggle dataset metadata
          KAGGLE_USERNAME="${{ steps.set_kaggle_creds.outputs.kaggle_username }}"
          cat > kaggle-dataset/dataset-metadata.json <<EOF
          {
            "id": "$KAGGLE_USERNAME/video-editing-data",
            "title": "Video Editing Data",
            "licenses": [
              { "name": "CC0-1.0" }
            ],
            "isPrivate": true
          }
          EOF

      # Create or Update Kaggle Dataset
      - name: Create or Update Kaggle Dataset
        run: |
          KAGGLE_USERNAME="${{ steps.set_kaggle_creds.outputs.kaggle_username }}"
          for i in $(seq 1 5); do
            if kaggle datasets status $KAGGLE_USERNAME/video-editing-data >/dev/null 2>&1; then
              echo "✅ Dataset exists, versioning... (Attempt $i)"
              if kaggle datasets version -p kaggle-dataset -m "Update dataset for run" --dir-mode zip; then
                echo "✅ Versioning successful"
                break
              fi
            else
              echo "⚡ Dataset not found, creating... (Attempt $i)"
              if kaggle datasets create -p kaggle-dataset --dir-mode zip; then
                echo "✅ Creation successful"
                break
              fi
            fi

            if [ $i -lt 5 ]; then
              echo "⚠️ Command failed. Retrying in 30 seconds..."
              sleep 30
            else
              echo "❌ Command failed after 5 attempts."
              exit 1
            fi
          done

      # List datasets
      - name: List Datasets
        run: |
          KAGGLE_USERNAME="${{ steps.set_kaggle_creds.outputs.kaggle_username }}"
          echo "📦 Listing datasets for user: $KAGGLE_USERNAME"
          sleep 60
          kaggle datasets list --user $KAGGLE_USERNAME

      # Prepare Kernel Metadata
      - name: Prepare Kernel Metadata
        run: |
          KAGGLE_USERNAME="${{ steps.set_kaggle_creds.outputs.kaggle_username }}"
          cat > kernel-metadata.json <<EOF
          {
            "id": "$KAGGLE_USERNAME/video-editing-scheduler-notebook",
            "title": "Video Editing Scheduler Notebook",
            "code_file": "IPNBY/quality.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "dataset_sources": [
              "$KAGGLE_USERNAME/video-editing-data"
            ],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF

      # Push Notebook to Kaggle
      - name: Push Notebook to Kaggle
        run: |
          kaggle kernels push -p . --accelerator NvidiaTeslaT4
          echo "Notebook pushed to Kaggle successfully"

      - name: Finalize Submission State
        run: |
          ACCOUNT_NUM="${{ needs.prepare-submission.outputs.account_number }}"
          VIDEO_NUMBER="${{ needs.prepare-submission.outputs.video_number }}"
          ACCOUNT_NUM="$ACCOUNT_NUM" VIDEO_NUMBER="$VIDEO_NUMBER" python3 KAGGLE/kaggle_pending_manager.py finalize

      - name: Commit Submission State
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "github-actions@github.com"
          git add counter_video_editing.txt KAGGLE/kaggle_account_tracker.txt KAGGLE/kaggle_pending_runs.json
          git commit -m "Queue Video_${{ needs.prepare-submission.outputs.video_number }} on Kaggle account ${{ needs.prepare-submission.outputs.account_number }}" || echo "No changes to commit"
          git pull --rebase origin main
          git push
